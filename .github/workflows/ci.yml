name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      slopmachine: ${{ steps.filter.outputs.slopmachine }}
      slopguard: ${{ steps.filter.outputs.slopguard }}
      skills: ${{ steps.filter.outputs.skills }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            slopmachine:
              - 'cli/slopmachine/**'
              - 'skills/slopmachine/**'
            slopguard:
              - 'cli/slopguard/**'
            skills:
              - 'skills/**'
              - 'cli/*/skills/**'

  slopmachine:
    name: slopmachine verify
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.slopmachine == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/slopmachine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          working_directory: cli/slopmachine
      - run: mise run verify

  slopguard:
    name: slopguard verify
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.slopguard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/slopguard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          working_directory: cli/slopguard
      - run: mise run verify

  skills:
    name: skills lint
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tesslio/setup-tessl@33e1c9253e3673f28e1b8949475b250dbd57918e # v2
        with:
          version: "0.94.0"
      - name: Lint every skill package
        env:
          TESSL_AUTO_UPDATE_INTERVAL_MINUTES: "0"
        run: |
          set -euo pipefail
          for skill in skills/*/ cli/*/skills/*/; do
            [ -f "$skill/SKILL.md" ] || continue
            tessl plugin lint "$skill"
          done
