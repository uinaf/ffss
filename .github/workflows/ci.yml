name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      slopmachine: ${{ steps.filter.outputs.slopmachine }}
      slopguard: ${{ steps.filter.outputs.slopguard }}
      skills: ${{ steps.filter.outputs.skills }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            slopmachine:
              - 'cli/slopmachine/**'
              - 'skills/slopmachine/**'
            slopguard:
              - 'cli/slopguard/**'
            skills:
              - 'skills/**'
              - 'cli/*/skills/**'
              - 'tools/skill-evals/**'

  slopmachine:
    name: slopmachine verify
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.slopmachine == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/slopmachine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          working_directory: cli/slopmachine
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: go-slopmachine-${{ runner.os }}-${{ hashFiles('cli/slopmachine/go.sum', 'cli/slopmachine/mise.toml') }}
          restore-keys: |
            go-slopmachine-${{ runner.os }}-
      - run: mise run verify

  slopguard:
    name: slopguard verify
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.slopguard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/slopguard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          working_directory: cli/slopguard
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: go-slopguard-${{ runner.os }}-${{ hashFiles('cli/slopguard/go.sum', 'cli/slopguard/mise.toml') }}
          restore-keys: |
            go-slopguard-${{ runner.os }}-
      - run: mise run verify

  skills:
    name: skills lint
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/skill-evals/package-lock.json
      - run: npm ci
        working-directory: tools/skill-evals
      - name: Lint every skill package
        run: npm run lint
        working-directory: tools/skill-evals
