name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      slopshipper: ${{ steps.filter.outputs.slopshipper }}
      autoreview: ${{ steps.filter.outputs.autoreview }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            slopshipper:
              - 'slopshipper/**'
            autoreview:
              - 'autoreview/**'

  slopshipper:
    name: slopshipper verify
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.slopshipper == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slopshipper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          working_directory: slopshipper
      - run: mise run verify

  autoreview:
    name: autoreview verify
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.autoreview == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autoreview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          working_directory: autoreview
      - run: mise run verify
