name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-24.04
    outputs:
      clilib: ${{ steps.filter.outputs.clilib }}
      slopmachine: ${{ steps.filter.outputs.slopmachine }}
      slopguard: ${{ steps.filter.outputs.slopguard }}
      skills: ${{ steps.filter.outputs.skills }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            clilib:
              - 'cli/lib/**'
            slopmachine:
              - 'cli/slopmachine/**'
              - 'cli/lib/**'
              - 'skills/slopmachine/**'
            slopguard:
              - 'cli/slopguard/**'
              - 'cli/lib/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-slopguard.yml'
            skills:
              - 'skills/**'
              - 'cli/*/skills/**'
              - 'tools/skill-evals/**'

  clilib:
    name: cli/lib verify
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.clilib == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cli/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: cli/lib
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-clilib-${{ runner.os }}-${{ hashFiles('cli/lib/go.mod', 'cli/lib/go.sum', 'cli/lib/mise.toml') }}
          restore-keys: |
            go-clilib-${{ runner.os }}-
      - run: mise run verify

  slopmachine:
    name: slopmachine verify
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.slopmachine == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cli/slopmachine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: cli/slopmachine
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: go-slopmachine-${{ runner.os }}-${{ hashFiles('cli/slopmachine/go.sum', 'cli/slopmachine/mise.toml') }}
          restore-keys: |
            go-slopmachine-${{ runner.os }}-
      - run: mise run verify

  slopguard:
    name: slopguard verify
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.slopguard == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cli/slopguard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: cli/slopguard
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: go-slopguard-${{ runner.os }}-${{ hashFiles('cli/slopguard/go.sum', 'cli/slopguard/mise.toml') }}
          restore-keys: |
            go-slopguard-${{ runner.os }}-
      - run: mise run verify

  slopguard-darwin:
    name: slopguard Darwin verify
    needs: changes
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.slopguard == 'true')
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli/slopguard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: cli/slopguard
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-slopguard-${{ runner.os }}-${{ hashFiles('cli/slopguard/go.sum', 'cli/slopguard/mise.toml') }}
          restore-keys: |
            go-slopguard-${{ runner.os }}-
      - run: mise run verify:darwin

  slopguard-integration:
    name: slopguard integration and vulnerabilities
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.slopguard == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli/slopguard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: cli/slopguard
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-slopguard-${{ runner.os }}-${{ hashFiles('cli/slopguard/go.sum', 'cli/slopguard/mise.toml') }}
          restore-keys: |
            go-slopguard-${{ runner.os }}-
      - run: mise run test:integration
      - run: mise run vuln

  skills:
    name: skills lint
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/skill-evals/package-lock.json
      - run: npm ci
        working-directory: tools/skill-evals
      - name: Lint every skill package
        run: npm run lint
        working-directory: tools/skill-evals

  verify:
    name: Repository checks
    if: always()
    needs: [changes, clilib, slopmachine, slopguard, slopguard-darwin, slopguard-integration, skills]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selected checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CLILIB_SELECTED: ${{ github.event_name == 'workflow_dispatch' && 'true' || needs.changes.outputs.clilib }}
          SLOPMACHINE_SELECTED: ${{ github.event_name == 'workflow_dispatch' && 'true' || needs.changes.outputs.slopmachine }}
          SLOPGUARD_SELECTED: ${{ github.event_name == 'workflow_dispatch' && 'true' || needs.changes.outputs.slopguard }}
          SKILLS_SELECTED: ${{ github.event_name == 'workflow_dispatch' && 'true' || needs.changes.outputs.skills }}
          CLILIB_RESULT: ${{ needs.clilib.result }}
          CLILIB_EXPECTED: ${{ (github.event_name == 'workflow_dispatch' || needs.changes.outputs.clilib == 'true') && 'success' || 'skipped' }}
          SLOPMACHINE_RESULT: ${{ needs.slopmachine.result }}
          SLOPMACHINE_EXPECTED: ${{ (github.event_name == 'workflow_dispatch' || needs.changes.outputs.slopmachine == 'true') && 'success' || 'skipped' }}
          SLOPGUARD_RESULT: ${{ needs.slopguard.result }}
          SLOPGUARD_EXPECTED: ${{ (github.event_name == 'workflow_dispatch' || needs.changes.outputs.slopguard == 'true') && 'success' || 'skipped' }}
          DARWIN_RESULT: ${{ needs.slopguard-darwin.result }}
          DARWIN_EXPECTED: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.slopguard == 'true')) && 'success' || 'skipped' }}
          INTEGRATION_RESULT: ${{ needs.slopguard-integration.result }}
          SKILLS_RESULT: ${{ needs.skills.result }}
          SKILLS_EXPECTED: ${{ (github.event_name == 'workflow_dispatch' || needs.changes.outputs.skills == 'true') && 'success' || 'skipped' }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$CLILIB_SELECTED" = true || test "$CLILIB_SELECTED" = false
          test "$SLOPMACHINE_SELECTED" = true || test "$SLOPMACHINE_SELECTED" = false
          test "$SLOPGUARD_SELECTED" = true || test "$SLOPGUARD_SELECTED" = false
          test "$SKILLS_SELECTED" = true || test "$SKILLS_SELECTED" = false
          test "$CLILIB_RESULT" = "$CLILIB_EXPECTED"
          test "$SLOPMACHINE_RESULT" = "$SLOPMACHINE_EXPECTED"
          test "$SLOPGUARD_RESULT" = "$SLOPGUARD_EXPECTED"
          test "$DARWIN_RESULT" = "$DARWIN_EXPECTED"
          test "$INTEGRATION_RESULT" = "$SLOPGUARD_EXPECTED"
          test "$SKILLS_RESULT" = "$SKILLS_EXPECTED"
