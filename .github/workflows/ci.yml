name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      slopshipper: ${{ steps.filter.outputs.slopshipper }}
      slopguard: ${{ steps.filter.outputs.slopguard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            slopshipper:
              - 'cli/slopshipper/**'
            slopguard:
              - 'cli/slopguard/**'

  slopshipper:
    name: slopshipper verify
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.slopshipper == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/slopshipper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          working_directory: cli/slopshipper
      - run: mise run verify

  slopguard:
    name: slopguard verify
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.slopguard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/slopguard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          working_directory: cli/slopguard
      - run: mise run verify
