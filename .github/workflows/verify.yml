name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skills: ${{ contains(fromJSON(steps.changes.outputs.changes), 'skills') }}
    steps:
      - id: changes
        uses: uinaf/.github/.github/actions/changes@2925de07626b63b95f77f19e50f10fb7729033bd # v3.0.6
        with:
          filters: |
            skills:
              - 'skills/**'
              - 'tools/skill-evals/**'
              - '.github/workflows/verify.yml'

  skills:
    name: skills lint
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/skill-evals/package-lock.json
      - run: npm ci
        working-directory: tools/skill-evals
      - name: Lint every skill package
        run: npm run lint
        working-directory: tools/skill-evals
      - name: Audit the harness dependencies
        run: npm run audit
        working-directory: tools/skill-evals
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: skills/slopcourier/scripts/bodycheck/go.mod
          cache: false
      - name: Test the slopcourier body check
        run: test -z "$(gofmt -l .)" && go vet ./... && go test ./...
        working-directory: skills/slopcourier/scripts/bodycheck
      - name: Test the slopcourier pull request watcher
        run: test -z "$(gofmt -l .)" && go vet ./... && go test ./...
        working-directory: skills/slopcourier/scripts/prwatch

  verify:
    if: always()
    needs: [changes, skills]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selected checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SKILLS_SELECTED: ${{ github.event_name == 'workflow_dispatch' && 'true' || needs.changes.outputs.skills }}
          SKILLS_RESULT: ${{ needs.skills.result }}
          SKILLS_EXPECTED: ${{ (github.event_name == 'workflow_dispatch' || needs.changes.outputs.skills == 'true') && 'success' || 'skipped' }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$SKILLS_SELECTED" = true || test "$SKILLS_SELECTED" = false
          test "$SKILLS_RESULT" = "$SKILLS_EXPECTED"

      - name: Check out for the scan
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan
        if: ${{ !cancelled() }}
        uses: uinaf/.github/.github/actions/scan@2925de07626b63b95f77f19e50f10fb7729033bd # v3.0.6
