version: 2

project_name: slopmachine

builds:
  - id: slopmachine
    main: ./cmd/slopmachine
    binary: slopmachine
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/uinaf/ffsstack/cli/slopmachine/internal/buildinfo.version={{ if .IsSnapshot }}v{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
      - -X github.com/uinaf/ffsstack/cli/slopmachine/internal/buildinfo.commit={{ .FullCommit }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: slopmachine
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

notarize:
  macos:
    - enabled: '{{ isEnvSet "APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64" }}'
      ids:
        - slopmachine
      sign:
        certificate: "{{ .Env.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}"
        password: "{{ .Env.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.APPLE_NOTARY_API_ISSUER_ID }}"
        key_id: "{{ .Env.APPLE_NOTARY_API_KEY_ID }}"
        key: "{{ .Env.APPLE_NOTARY_API_KEY_P8_BASE64 }}"
        wait: true
        timeout: 20m

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  disable: true

release:
  # Publishing is workflow-owned; goreleaser only builds, signs, and
  # notarizes (release workflows run with --skip=publish).
  disable: true
