version: 2

project_name: slopshipper

builds:
  - id: slopshipper
    main: ./cmd/slopshipper
    binary: slopshipper
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/uinaf/slopshipper/internal/buildinfo.version={{ if .IsSnapshot }}v{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
      - -X github.com/uinaf/slopshipper/internal/buildinfo.commit={{ .FullCommit }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: slopshipper
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

notarize:
  macos:
    - enabled: '{{ isEnvSet "APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64" }}'
      ids:
        - slopshipper
      sign:
        certificate: "{{ .Env.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}"
        password: "{{ .Env.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.APPLE_NOTARY_API_ISSUER_ID }}"
        key_id: "{{ .Env.APPLE_NOTARY_API_KEY_ID }}"
        key: "{{ .Env.APPLE_NOTARY_API_KEY_P8_BASE64 }}"
        wait: true
        timeout: 20m

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  disable: true

release:
  github:
    owner: uinaf
    name: slopshipper
  draft: true
  use_existing_draft: true
  mode: keep-existing
  replace_existing_artifacts: true
  prerelease: auto

homebrew_casks:
  - name: slopshipper
    ids:
      - slopshipper
    binaries:
      - slopshipper
    repository:
      owner: uinaf
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    commit_author:
      use_github_app_token: true
    commit_msg_template: "chore(slopshipper): update to {{ .Tag }}"
    homepage: https://github.com/uinaf/slopshipper
    description: Deterministic and structured approach to slop cannoning
    license: MIT
    url:
      verified: github.com/uinaf/slopshipper/
