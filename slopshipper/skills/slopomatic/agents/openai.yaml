interface:
  display_name: "Slopomatic"
  short_description: "Run a plan with human gates and evidence-backed loops"
  default_prompt: |
    Use $slopomatic.

    Goal: structured slop-cannoning — clarify intake, human release, then obey
    slopomatic status next_action through build → verify → review → deliver.

    Require the installed slopomatic binary. If no run exists, init and submit
    a concrete intake via stdin, then wait for the exact human release. Confirm
    review approach once at intake (autoreview CLI and/or Cursor Bugbot). Obey
    actionable next_action; never silently retry BLOCKED work. Prefer strong
    models for build and cheaper review. Do not invent a second runtime.

    Output: compact status-driven updates only.

policy:
  allow_implicit_invocation: false
