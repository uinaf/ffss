interface:
  display_name: "Slopomatic"
  short_description: "Run a plan with human gates and evidence-backed loops"
  default_prompt: |
    Use $slopomatic.

    Goal: structured slop-cannoning — clarify intake, human release, then obey
    slopomatic status next_action through build → verify → review → deliver.

    Require the installed slopomatic binary. Confirm review approach once at
    intake (autoreview CLI and/or Cursor Bugbot). Prefer strong models for
    build and cheaper review. Do not invent a second runtime or narrate phases.

    Output: compact status-driven updates only.

policy:
  allow_implicit_invocation: false
