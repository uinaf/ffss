name: verify

on:
  push:
    branches: [main]
  pull_request:

# CI runs the same three commands an orchestrator runs, with CI as the declared
# runner. Versions come from package.json, never from literals in this file.
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AGENT_TASK_ID: ci-${{ github.run_id }}
      AGENT_ATTEMPT_ID: attempt-${{ github.run_attempt }}
      AGENT_RESULT_TYPE: implementation
      AGENT_SUBMISSION_TARGET: none
      AGENT_MERGE_AUTHORITY: none
      AGENT_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
      AGENT_RUNNER: github-hosted-ubuntu-latest
      AGENT_ENVIRONMENT: ci
      # CI is not the devbox: it holds a scoped CI identity, not the devbox
      # machine identity. Same contract, different provisioner.
      INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
      INFISICAL_API_URL: ${{ vars.INFISICAL_API_URL }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - run: corepack enable

      - run: pnpm bootstrap

      - run: pnpm doctor

      - run: pnpm verify

      - if: always()
        run: pnpm run teardown -- --reason ${{ job.status == 'success' && 'success' || 'failure' }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
