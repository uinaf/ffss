interface:
  display_name: "Agent-Readiness"
  short_description: "Audit repo and runner readiness for autonomous work"
  default_prompt: "Use $agent-readiness to audit and improve agent guidance, repository lifecycle, and runner readiness for implementation or QA work. Treat AGENTS.md as an executable, model-neutral operating contract: check orientation, routing, authority, bootstrap, canonical verification, real-surface evidence, recovery, and write-back against the checkout and declared runner. Grade repository capability, runner capability, and evidence strength separately; treat C as a checkpoint; continue through setup and recovery until the requested result or an evidenced authority, scope, or safety blocker; and never review an existing diff, make ship decisions, or perform unauthorized submissions."

policy:
  allow_implicit_invocation: false
