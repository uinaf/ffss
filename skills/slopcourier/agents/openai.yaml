interface:
  display_name: "slopcourier"
  short_description: "Deliver finished work as a change request"
  default_prompt: "Use $slopcourier to deliver this completed change as one change request. Require applicable passing gates and proof appropriate to the change, preserve unrelated work, follow forge and template contracts, and return the URL. Preparation-only requests stop at the draft."

policy:
  allow_implicit_invocation: true
